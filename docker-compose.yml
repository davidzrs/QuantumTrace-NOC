# One-command local demo:  docker compose up --build
#   API  -> http://localhost:8000/docs
#   Web  -> http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      QT_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      QT_API_KEY: ${QT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}  # from ./.env when present; empty turns AI fixes off
  web:
    build:
      context: .
      dockerfile: frontend/apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["8080:8080"]
    depends_on: [api]
