# Fixture: a storefront still serving TLS 1.0 and static RSA.
server {
    listen 443 ssl;
    server_name shop.example.com;
    ssl_certificate /etc/nginx/certs/shop.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL:!MD5';
    ssl_ecdh_curve prime256v1:secp384r1;
}
