[project]
name = "quantumtrace"
version = "0.1.0"
description = "Cryptographic agility & post-quantum readiness scanner (JunctionX Lisbon 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "scapy>=2.6",
  "httpx>=0.27",
  "cryptography>=43",
  "google-genai>=2.29.0",
]

[project.scripts]
quantumtrace = "quantumtrace.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
  "cyclonedx-python-lib[json-validation]>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumtrace"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
# The tracer runs inside the user's own interpreter, whatever its version, and must never break
# the program it watches: old syntax on purpose, and hooks that swallow their own errors.
"src/quantumtrace/tracers/python/*" = ["UP", "S110", "SIM105", "B009"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
# stand-alone and unannotated, so it also imports on interpreters older than this project's
exclude = ["src/quantumtrace/tracers/python/"]

[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = false
