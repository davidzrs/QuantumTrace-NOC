  ELBSecurityPolicy-2016-08:
    protocols: [TLSv1, TLSv1.1, TLSv1.2]
    ciphers: *p_2016_08
  # No longer on the AWS page; kept for older exports with the 2016-08 suites (not re-verified).
  ELBSecurityPolicy-TLS-1-0-2015-04:
    protocols: [TLSv1, TLSv1.1, TLSv1.2]
    ciphers: *p_2016_08
