# AWS Elastic Load Balancing predefined TLS security policies -> protocols and ciphers.
# Source: "Security policies for your Application Load Balancer", all four tables (TLS, FIPS,
# RFC 9151, FS), checked 2026-10-11:
# https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
# Cipher names use OpenSSL notation; decomposed by rules/tls.py.
#
# Policies with PQ in the name offer SecP256r1MLKEM768, SecP384r1MLKEM1024 and X25519MLKEM768 and,
# per AWS, also classical key exchange for clients without ML-KEM. AWS doesn't list the classical
# groups, so they are assumed to be the defaults the scanner uses elsewhere (rules/tls.py
# CLASSICAL_TLS13_GROUPS).

