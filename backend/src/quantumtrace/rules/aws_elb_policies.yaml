# AWS Elastic Load Balancing predefined TLS security policies -> protocols and ciphers.
# Source: AWS docs "Security policies for your Application Load Balancer" / NLB equivalents.
# TODO(team): verify against the current AWS table and extend with more policies as needed.
# Cipher names use OpenSSL notation; decomposed by rules/tls.py.

_cipher_sets:
  legacy_full: &legacy_full
    - ECDHE-ECDSA-AES128-GCM-SHA256
    - ECDHE-RSA-AES128-GCM-SHA256
    - ECDHE-ECDSA-AES128-SHA256
    - ECDHE-RSA-AES128-SHA256
    - ECDHE-ECDSA-AES128-SHA
    - ECDHE-RSA-AES128-SHA
    - ECDHE-ECDSA-AES256-GCM-SHA384
    - ECDHE-RSA-AES256-GCM-SHA384
    - ECDHE-ECDSA-AES256-SHA384
    - ECDHE-RSA-AES256-SHA384
    - ECDHE-RSA-AES256-SHA
    - ECDHE-ECDSA-AES256-SHA
    - AES128-GCM-SHA256
    - AES128-SHA256
    - AES128-SHA
    - AES256-GCM-SHA384
    - AES256-SHA256
    - AES256-SHA
  tls12_2017: &tls12_2017
    - ECDHE-ECDSA-AES128-GCM-SHA256
    - ECDHE-RSA-AES128-GCM-SHA256
    - ECDHE-ECDSA-AES128-SHA256
    - ECDHE-RSA-AES128-SHA256
    - ECDHE-ECDSA-AES256-GCM-SHA384
    - ECDHE-RSA-AES256-GCM-SHA384
    - ECDHE-ECDSA-AES256-SHA384
    - ECDHE-RSA-AES256-SHA384
    - AES128-GCM-SHA256
    - AES128-SHA256
    - AES256-GCM-SHA384
    - AES256-SHA256
  tls13_suites: &tls13_suites
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256

policies:
  ELBSecurityPolicy-2016-08:
    protocols: [TLSv1, TLSv1.1, TLSv1.2]
    ciphers: *legacy_full
  ELBSecurityPolicy-TLS-1-0-2015-04:
    protocols: [TLSv1, TLSv1.1, TLSv1.2]
    ciphers: *legacy_full
  ELBSecurityPolicy-TLS-1-1-2017-01:
    protocols: [TLSv1.1, TLSv1.2]
    ciphers: *legacy_full
  ELBSecurityPolicy-TLS-1-2-2017-01:
    protocols: [TLSv1.2]
    ciphers: *tls12_2017
  ELBSecurityPolicy-FS-1-2-Res-2020-10:
    protocols: [TLSv1.2]
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
  ELBSecurityPolicy-TLS13-1-2-2021-06:
    protocols: [TLSv1.2, TLSv1.3]
    ciphers:
      - TLS_AES_128_GCM_SHA256
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES128-SHA256
      - ECDHE-RSA-AES128-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-AES256-SHA384
      - ECDHE-RSA-AES256-SHA384
  ELBSecurityPolicy-TLS13-1-3-2021-06:
    protocols: [TLSv1.3]
    ciphers: *tls13_suites
  # Post-quantum hybrid policies (ML-KEM key exchange). TODO(team): confirm exact policy names.
  ELBSecurityPolicy-TLS13-1-2-PQ-2025-09:
    protocols: [TLSv1.2, TLSv1.3]
    ciphers: *tls13_suites
    groups: [X25519MLKEM768, SecP256r1MLKEM768]
  ELBSecurityPolicy-TLS13-1-3-PQ-2025-09:
    protocols: [TLSv1.3]
    ciphers: *tls13_suites
    groups: [X25519MLKEM768, SecP256r1MLKEM768]
