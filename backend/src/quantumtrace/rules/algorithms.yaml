# QuantumTrace algorithm rules: the SINGLE source of truth for risk tiers.
#
# Lookup (see core/classifier.py): names are normalised (upper-case, non-alphanumerics
# stripped). The classifier first tries "<algorithm>-<key_size>", then "<algorithm>".
# So "AES" + key_size 128 -> "AES128" -> rule aes-128.
#
# tier:     critical (Shor) | medium (Grover) | safe | unknown
# threat:   shor | grover | none | unknown
# classically_broken: true for primitives already broken without a quantum computer
#   (scoring treats these with critical weight).
# classical_security_bits / nist_quantum_level feed the CBOM (CycloneDX classicalSecurityLevel /
#   nistQuantumSecurityLevel). For RSA/DH/EC the classifier derives classical bits from key size.
# NIST references: FIPS 203 = ML-KEM, FIPS 204 = ML-DSA, FIPS 205 = SLH-DSA,
#   SP 800-208 = LMS/XMSS, IR 8547 = transition timeline (112-bit quantum-vulnerable keys
#   deprecated after 2030; every quantum-vulnerable key disallowed after 2035).

# Misuse flags a scanner can set on an asset. Any of them makes the finding classically broken
# (whatever the primitive's quantum tier): the data is exposed today, no quantum computer needed.
# The text is appended to the rule's rationale.
misuse:
  ecb-mode: ECB mode encrypts equal blocks to equal ciphertext, so patterns in the data leak.
  hardcoded-key: The key is written in the source, so anyone with the code can decrypt.

# Flags that call for a review without proving anything broken. The text is appended to the
# rule's rationale; the finding keeps the rule's classically_broken.
review:
  hand-rolled-crypto: A home-made construction instead of a vetted library call; check it against the standard, or replace it with the library's own.

rules:
  # ---------------------------------------------------------------- Shor-vulnerable (critical)
  - id: rsa
    name: RSA
    primitive: pke
    threat: shor
    tier: critical
    oid: 1.2.840.113549.1.1.1
    nist_reference: NIST IR 8547 (112-bit keys deprecated after 2030, all disallowed after 2035)
    replacement: ML-KEM (FIPS 203) for encryption/key transport; ML-DSA (FIPS 204) for signatures
    nist_quantum_level: 0
    rationale: Integer factorisation is solved in polynomial time by Shor's algorithm.
    aliases: [RSA, RSAES, RSA-OAEP, RSAES-OAEP, RSASSA-PSS, RSASSA-PKCS1-V1_5, RSA-PSS, SHA256withRSA,
              SHA1withRSA, SHA384withRSA, SHA512withRSA, RSA_2048, RSA_3072, RSA_4096, kRSA]
  - id: rsa-1024
    name: RSA-1024
    primitive: pke
    threat: shor
    tier: critical
    classically_broken: true
    oid: 1.2.840.113549.1.1.1
    nist_reference: NIST SP 800-131A (disallowed), NIST IR 8547
    replacement: ML-KEM (FIPS 203) / ML-DSA (FIPS 204)
    classical_security_bits: 80
    nist_quantum_level: 0
    rationale: Shor-vulnerable and below the 112-bit classical security floor.
    aliases: [RSA-1024, RSA-512, RSA-768]
  - id: dsa
    name: DSA
    primitive: signature
    threat: shor
    tier: critical
    classically_broken: true
    oid: 1.2.840.10040.4.1
    nist_reference: FIPS 186-5 (DSA withdrawn for signing), NIST IR 8547
    replacement: ML-DSA (FIPS 204) or SLH-DSA (FIPS 205)
    nist_quantum_level: 0
    rationale: Discrete logarithm is solved by Shor's algorithm, and FIPS 186-5 no longer approves DSA for generating signatures (only for verifying old ones).
    aliases: [DSA, SHA1withDSA, SHA256withDSA]
  - id: ecdsa
    name: ECDSA
    primitive: signature
    threat: shor
    tier: critical
    oid: 1.2.840.10045.2.1
    nist_reference: NIST IR 8547 (112-bit curves deprecated after 2030, all disallowed after 2035)
    replacement: ML-DSA (FIPS 204) or hybrid ECDSA+ML-DSA during transition
    nist_quantum_level: 0
    rationale: Elliptic-curve discrete logarithm is solved by Shor's algorithm.
    aliases: [ECDSA, EC, ECC, ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521, ECC_SECG_P256K1, EC_prime256v1,
              EC_secp384r1, EC_secp521r1, P-256, P-384, P-521, secp256r1, secp384r1, secp521r1, secp256k1,
              prime256v1, SHA256withECDSA, SHA384withECDSA, ECDSA_WITH_SHA256, ECDSA_WITH_SHA384, aECDSA]
  - id: eddsa
    name: EdDSA
    primitive: signature
    threat: shor
    tier: critical
    oid: 1.3.101.112
    nist_reference: FIPS 186-5, NIST IR 8547
    replacement: ML-DSA (FIPS 204)
    classical_security_bits: 128
    nist_quantum_level: 0
    rationale: Edwards-curve signatures rely on ECDLP, solved by Shor's algorithm.
    aliases: [EdDSA, Ed25519, Ed448]
  - id: ecdh
    name: ECDH
    primitive: key-agree
    threat: shor
    tier: critical
    oid: 1.3.132.1.12
    nist_reference: NIST SP 800-56A, NIST IR 8547
    replacement: ML-KEM (FIPS 203), or hybrid X25519MLKEM768 in TLS 1.3
    nist_quantum_level: 0
    rationale: ECDH key agreement relies on ECDLP; recorded sessions are exposed to Harvest-Now-Decrypt-Later.
    aliases: [ECDH, ECDHE, kECDHE, X25519, X448, secp256r1-kex, ECDH_P256]
  - id: dh
    name: Diffie-Hellman
    primitive: key-agree
    threat: shor
    tier: critical
    oid: 1.2.840.113549.1.3.1
    nist_reference: NIST SP 800-56A, NIST IR 8547
    replacement: ML-KEM (FIPS 203)
    nist_quantum_level: 0
    rationale: Finite-field discrete logarithm is solved by Shor's algorithm.
    aliases: [DH, DHE, FFDHE, kDHE, ffdhe2048, ffdhe3072, diffie-hellman-group14-sha256]
  - id: dh-1024
    name: DH-1024
    primitive: key-agree
    threat: shor
    tier: critical
    classically_broken: true
    oid: 1.2.840.113549.1.3.1
    nist_reference: NIST SP 800-131A (disallowed), NIST IR 8547
    replacement: ML-KEM (FIPS 203)
    classical_security_bits: 80
    nist_quantum_level: 0
    rationale: Shor-vulnerable and only ~80 bits classically; Logjam estimated that one nation-state-scale precomputation for a 1024-bit group could break every server that shares it.
    aliases: [DH-1024, DH-512, DH-768, DHE-1024, DHE-512, DHE-768, diffie-hellman-group1-sha1]
  - id: sm2
    name: SM2
    primitive: signature
    threat: shor
    tier: critical
    nist_reference: null
    replacement: ML-DSA (FIPS 204)
    classical_security_bits: 128
    nist_quantum_level: 0
    rationale: SM2 is an elliptic-curve scheme, vulnerable to Shor's algorithm.
    aliases: [SM2]

  # ---------------------------------------------------------------- Grover-weakened (medium)
  - id: aes-128
    name: AES-128
    primitive: block-cipher
    threat: grover
    tier: medium
    oid: 2.16.840.1.101.3.4.1.2
    nist_reference: NIST SP 800-38D; CNSA 2.0 requires AES-256
    replacement: AES-256
    classical_security_bits: 128
    nist_quantum_level: 1
    rationale: Grover's algorithm reduces 128-bit key search to ~64-bit effective security.
    aliases: [AES-128, AES128, AES-128-GCM, AES-128-CBC, AES-128-CCM, AES128-GCM, AES_128_GCM]
  - id: 3des
    name: 3DES
    primitive: block-cipher
    threat: grover
    tier: medium
    classically_broken: true
    oid: 1.2.840.113549.3.7
    nist_reference: NIST SP 800-67r2 (withdrawn 2024)
    replacement: AES-256
    classical_security_bits: 112
    nist_quantum_level: 0
    rationale: 112-bit (at best) key; Grover halves it and Sweet32 already breaks it classically.
    aliases: [3DES, TDES, TripleDES, DESede, DES-EDE3, DES-CBC3, 3DES-EDE, 3DES-CBC, 3DES_EDE_CBC]
  - id: des
    name: DES
    primitive: block-cipher
    threat: grover
    tier: medium
    classically_broken: true
    nist_reference: FIPS 46-3 (withdrawn)
    replacement: AES-256
    classical_security_bits: 56
    nist_quantum_level: 0
    rationale: 56-bit key is brute-forceable classically.
    aliases: [DES]
  - id: rc4
    name: RC4
    primitive: stream-cipher
    threat: grover
    tier: medium
    classically_broken: true
    replacement: AES-256-GCM or ChaCha20-Poly1305
    nist_quantum_level: 0
    rationale: Biased keystream; prohibited in TLS (RFC 7465).
    aliases: [RC4, ARCFOUR]
  - id: sha1
    name: SHA-1
    primitive: hash
    threat: grover
    tier: medium
    classically_broken: true
    oid: 1.3.14.3.2.26
    nist_reference: NIST SP 800-131A (disallowed for signatures), FIPS 180-4
    replacement: SHA-384 / SHA3-384
    nist_quantum_level: 0
    rationale: Practical collisions exist (SHAttered); Grover further weakens preimage resistance.
    aliases: [SHA-1, SHA1]
  - id: md5
    name: MD5
    primitive: hash
    threat: grover
    tier: medium
    classically_broken: true
    oid: 1.2.840.113549.2.5
    replacement: SHA-384 / SHA3-384
    nist_quantum_level: 0
    rationale: Trivially collidable; must not be used for any security purpose.
    aliases: [MD5]
  - id: hmac-sha1
    name: HMAC-SHA1
    primitive: mac
    threat: grover
    tier: medium
    nist_reference: NIST SP 800-131A (legacy use only); FIPS 198-1
    replacement: HMAC-SHA256 or AEAD (AES-256-GCM, ChaCha20-Poly1305)
    classical_security_bits: 160
    nist_quantum_level: 1
    rationale: HMAC does not rely on collision resistance, but 160-bit output and SHA-1 deprecation make it legacy.
    aliases: [HMAC-SHA1, HmacSHA1]
  - id: hmac-md5
    name: HMAC-MD5
    primitive: mac
    threat: grover
    tier: medium
    replacement: HMAC-SHA256
    nist_quantum_level: 0
    rationale: HMAC does not rely on the hash's collision resistance (RFC 6151), so HMAC-MD5 is not broken, but it is deprecated and should be replaced.
    aliases: [HMAC-MD5, HmacMD5]
  - id: sha224
    name: SHA-224
    primitive: hash
    threat: grover
    tier: medium
    oid: 2.16.840.1.101.3.4.2.4
    replacement: SHA-384
    classical_security_bits: 112
    nist_quantum_level: 1
    rationale: 112-bit collision resistance falls below post-quantum margins.
    aliases: [SHA-224, SHA224]

  # ---------------------------------------------------------------- Quantum-resilient (safe)
  - id: aes-192
    name: AES-192
    primitive: block-cipher
    threat: grover
    tier: safe
    oid: 2.16.840.1.101.3.4.1.22
    replacement: AES-256 (CNSA 2.0)
    classical_security_bits: 192
    nist_quantum_level: 3
    rationale: ~96-bit effective security under Grover; acceptable per NIST, though CNSA 2.0 prefers AES-256.
    aliases: [AES-192, AES192]
  - id: aes-256
    name: AES-256
    primitive: block-cipher
    threat: grover
    tier: safe
    oid: 2.16.840.1.101.3.4.1.42
    nist_reference: FIPS 197; CNSA 2.0
    classical_security_bits: 256
    nist_quantum_level: 5
    rationale: 128-bit effective security under Grover.
    aliases: [AES-256, AES256, AES-256-GCM, AES-256-CBC, AES-256-CCM, AES256-GCM, AES_256_GCM,
              SYMMETRIC_DEFAULT]
  - id: chacha20
    name: ChaCha20-Poly1305
    primitive: ae
    threat: grover
    tier: safe
    classical_security_bits: 256
    nist_quantum_level: 5
    rationale: 256-bit key; 128-bit effective security under Grover.
    aliases: [ChaCha20, ChaCha20-Poly1305, CHACHA20_POLY1305, CHACHA20-POLY1305]
  - id: sha256
    name: SHA-256
    primitive: hash
    threat: grover
    tier: safe
    oid: 2.16.840.1.101.3.4.2.1
    nist_reference: FIPS 180-4
    classical_security_bits: 128
    nist_quantum_level: 2
    rationale: 128-bit preimage security under Grover; collision resistance unaffected in practice.
    aliases: [SHA-256, SHA256, SHA2-256]
  - id: sha384
    name: SHA-384
    primitive: hash
    threat: grover
    tier: safe
    oid: 2.16.840.1.101.3.4.2.2
    nist_reference: FIPS 180-4; CNSA 2.0
    classical_security_bits: 192
    nist_quantum_level: 4
    rationale: Large digest retains ample security under Grover.
    aliases: [SHA-384, SHA384, SHA512, SHA-512, SHA3-256, SHA3-384, SHA3-512]
  - id: hmac-sha256
    name: HMAC-SHA256
    primitive: mac
    threat: grover
    tier: safe
    nist_reference: FIPS 198-1
    classical_security_bits: 256
    nist_quantum_level: 5
    rationale: 256-bit keyed MAC; Grover leaves 128-bit security.
    aliases: [HMAC-SHA256, HmacSHA256, HMAC_256]
  - id: hmac-sha384
    name: HMAC-SHA384
    primitive: mac
    threat: grover
    tier: safe
    nist_reference: FIPS 198-1; CNSA 2.0
    classical_security_bits: 256
    nist_quantum_level: 5
    rationale: Large keyed MAC; ample security margin under Grover.
    aliases: [HMAC-SHA384, HmacSHA384, HMAC_384, HMAC-SHA512, HmacSHA512, HMAC_512]
  - id: pbkdf2
    name: PBKDF2
    primitive: kdf
    threat: grover
    tier: safe
    nist_reference: NIST SP 800-132
    rationale: Security depends on the PRF and iteration count; with HMAC-SHA256 it is not Shor-exposed.
    aliases: [PBKDF2, PBKDF2WithHmacSHA256, PBKDF2HMAC]
  # ML-KEM and ML-DSA: one rule per parameter set, since the OID and NIST category differ.
  # A bare name (no parameter set) resolves to the most common one, ML-KEM-768 / ML-DSA-65.
  - id: ml-kem-512
    name: ML-KEM-512
    primitive: kem
    threat: none
    tier: safe
    oid: 2.16.840.1.101.3.4.4.1
    nist_reference: FIPS 203
    nist_quantum_level: 1
    rationale: NIST-standardised lattice-based KEM.
    aliases: [ML-KEM-512, MLKEM512, Kyber512]
  - id: ml-kem
    name: ML-KEM
    primitive: kem
    threat: none
    tier: safe
    oid: 2.16.840.1.101.3.4.4.2
    nist_reference: FIPS 203
    nist_quantum_level: 3
    rationale: NIST-standardised lattice-based KEM.
    aliases: [ML-KEM, ML-KEM-768, MLKEM768, Kyber, Kyber768]
  - id: ml-kem-1024
    name: ML-KEM-1024
    primitive: kem
    threat: none
    tier: safe
    oid: 2.16.840.1.101.3.4.4.3
    nist_reference: FIPS 203
    nist_quantum_level: 5
    rationale: NIST-standardised lattice-based KEM.
    aliases: [ML-KEM-1024, MLKEM1024, Kyber1024]
  - id: x25519mlkem768
    name: X25519MLKEM768
    primitive: kem
    threat: none
    tier: safe
    nist_reference: FIPS 203 (hybrid with X25519)
    classical_security_bits: 128
    nist_quantum_level: 3
    rationale: Hybrid key exchange; secure as long as ML-KEM holds. Mitigates Harvest-Now-Decrypt-Later.
    aliases: [X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024, X25519Kyber768Draft00,
              mlkem768x25519-sha256]
  - id: ml-dsa-44
    name: ML-DSA-44
    primitive: signature
    threat: none
    tier: safe
    oid: 2.16.840.1.101.3.4.3.17
    nist_reference: FIPS 204
    nist_quantum_level: 2
    rationale: NIST-standardised lattice-based signature.
    aliases: [ML-DSA-44, ML_DSA_44, Dilithium2]
  - id: ml-dsa
    name: ML-DSA
    primitive: signature
    threat: none
    tier: safe
    oid: 2.16.840.1.101.3.4.3.18
    nist_reference: FIPS 204
    nist_quantum_level: 3
    rationale: NIST-standardised lattice-based signature.
    aliases: [ML-DSA, ML_DSA_65, ML-DSA-65, Dilithium, Dilithium3]
  - id: ml-dsa-87
    name: ML-DSA-87
    primitive: signature
    threat: none
    tier: safe
    oid: 2.16.840.1.101.3.4.3.19
    nist_reference: FIPS 204
    nist_quantum_level: 5
    rationale: NIST-standardised lattice-based signature.
    aliases: [ML-DSA-87, ML_DSA_87, Dilithium5]
  - id: slh-dsa
    name: SLH-DSA
    primitive: signature
    threat: none
    tier: safe
    nist_reference: FIPS 205
    nist_quantum_level: 1
    rationale: NIST-standardised stateless hash-based signature.
    aliases: [SLH-DSA, SPHINCS+]

  - id: sntrup761x25519
    name: sntrup761x25519
    primitive: kem
    threat: none
    tier: safe
    nist_reference: Not NIST-standardised (NTRU Prime); prefer mlkem768x25519-sha256 (FIPS 203)
    replacement: mlkem768x25519-sha256
    rationale: OpenSSH hybrid of Streamlined NTRU Prime and X25519; resists Shor while sntrup761 holds.
    aliases: [sntrup761x25519-sha512, sntrup761x25519]
  - id: hkdf
    name: HKDF
    primitive: kdf
    threat: grover
    tier: safe
    nist_reference: NIST SP 800-56C
    rationale: Extract-and-expand KDF; strength follows its hash (SHA-256 or larger is fine).
    aliases: [HKDF, HKDFExpand]
  - id: scrypt
    name: scrypt
    primitive: kdf
    threat: grover
    tier: safe
    rationale: Memory-hard password KDF; not exposed to Shor.
    aliases: [scrypt]
  - id: argon2
    name: Argon2
    primitive: kdf
    threat: grover
    tier: safe
    rationale: Memory-hard password KDF (RFC 9106); not exposed to Shor.
    aliases: [Argon2, Argon2id, Argon2i]
  - id: bcrypt
    name: bcrypt
    primitive: kdf
    threat: grover
    tier: safe
    rationale: Adaptive password hash; not exposed to Shor.
    aliases: [bcrypt]
  - id: aes
    name: AES (key size unknown)
    primitive: block-cipher
    threat: grover
    tier: medium
    replacement: AES-256
    rationale: Key length could not be determined statically; treated as AES-128 until proven otherwise.
    aliases: [AES]
  - id: blowfish
    name: Blowfish
    primitive: block-cipher
    threat: grover
    tier: medium
    classically_broken: true
    replacement: AES-256
    nist_quantum_level: 0
    rationale: 64-bit block size is vulnerable to birthday attacks (Sweet32).
    aliases: [Blowfish, blowfish-cbc, BF]
  - id: non-csprng
    name: Non-cryptographic RNG
    primitive: other
    threat: none
    tier: medium
    classically_broken: true
    replacement: CSPRNG (Python secrets/os.urandom, Java SecureRandom, Go crypto/rand)
    rationale: Predictable output; keys or tokens generated from it can be reconstructed by an attacker.
    aliases: [non-csprng, math/rand, java.util.Random, random]

  # ---------------------------------------------------------------- Protocols
  - id: ssl3.0
    name: SSL 3.0
    primitive: protocol
    threat: none
    tier: medium
    classically_broken: true
    nist_reference: RFC 7568 (prohibited)
    replacement: TLS 1.3 with X25519MLKEM768
    rationale: Broken protocol (POODLE); prevents adoption of PQC key exchange.
    aliases: [SSLv3, SSL3.0, "SSL 3.0"]
  - id: tls1.0
    name: TLS 1.0
    primitive: protocol
    threat: none
    tier: medium
    classically_broken: true
    nist_reference: NIST SP 800-52r2 (prohibited); RFC 8996
    replacement: TLS 1.3 with X25519MLKEM768
    rationale: Deprecated protocol; prevents adoption of PQC key exchange.
    aliases: [TLSv1, TLSv1.0, TLS1.0, "TLS 1.0"]
  - id: tls1.1
    name: TLS 1.1
    primitive: protocol
    threat: none
    tier: medium
    classically_broken: true
    nist_reference: NIST SP 800-52r2 (prohibited); RFC 8996
    replacement: TLS 1.3 with X25519MLKEM768
    rationale: Deprecated protocol; prevents adoption of PQC key exchange.
    aliases: [TLSv1.1, TLS1.1, "TLS 1.1"]
  - id: tls1.2
    name: TLS 1.2
    primitive: protocol
    threat: none
    tier: medium
    nist_reference: NIST SP 800-52r2 (TLS 1.3 support required); draft-ietf-tls-ecdhe-mlkem (TLS 1.3 only)
    replacement: TLS 1.3 with X25519MLKEM768
    rationale: Classically sound, but cannot carry hybrid post-quantum key exchange; a migration blocker.
    aliases: [TLSv1.2, TLS1.2, "TLS 1.2"]
  - id: tls1.3-classical
    name: TLS 1.3 (classical key exchange)
    primitive: protocol
    threat: none
    tier: medium
    nist_reference: draft-ietf-tls-ecdhe-mlkem; NIST IR 8547
    replacement: Enable X25519MLKEM768 (e.g. an AWS -PQ- security policy, OpenSSL 3.5+)
    rationale: TLS 1.3 is ready for PQC, but no hybrid ML-KEM group is enabled or negotiated, so sessions stay HNDL-exposed.
    aliases: [TLSv1.3-classical]
  - id: tls1.3
    name: TLS 1.3 (hybrid post-quantum)
    primitive: protocol
    threat: none
    tier: safe
    nist_reference: FIPS 203 via draft-ietf-tls-ecdhe-mlkem
    rationale: TLS 1.3 with a hybrid ML-KEM group negotiated or enabled.
    aliases: [TLSv1.3, TLS1.3, "TLS 1.3", TLSv1.3-pq]
  - id: plaintext
    name: No encryption
    primitive: protocol
    threat: none
    tier: medium  # not a quantum risk: classically_broken carries the weight
    classically_broken: true
    replacement: TLS 1.3 with X25519MLKEM768
    rationale: Traffic is readable today, no quantum computer required.
    aliases: [PLAINTEXT, HTTP]
